name: Build Ardour Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update
          sudo apt-get build-dep -y ardour
          sudo apt-get install -y python3 git build-essential pkg-config libarchive-dev libwebsockets-dev libcppunit-dev

      - name: Configure (Optimized)
        run: |
          python3 waf configure --optimize --freedesktop --no-nls --cxx11

      - name: Compile
        run: |
          # Use -k (keep going) so non-fatal sub-target warnings don't fail the entire build
          python3 waf -j$(nproc) -k || python3 waf -j1

      - name: Bundle Executables
        run: |
          mkdir -p release_build
          cp -r build/gtk2_ardour release_build/ 2>/dev/null || true
          cp -r build/libs release_build/ 2>/dev/null || true

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Linux-Release
          path: release_build/
