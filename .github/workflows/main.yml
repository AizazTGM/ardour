name: Build Ardour Windows Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 Environment (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            python3
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-gtk2
            mingw-w64-ucrt-x86_64-gtkmm
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-curl

      - name: Configure (Windows / MSYS2)
        shell: msys2 {0}
        run: |
          python3 waf configure --optimize --dist-target=mingw --no-nls

      - name: Compile
        shell: msys2 {0}
        run: |
          python3 waf -j$(nproc)

      - name: Bundle Executables
        shell: msys2 {0}
        run: |
          mkdir -p release_build
          if [ -d "build/gtk2_ardour" ]; then cp -r build/gtk2_ardour release_build/; fi
          if [ -d "build/libs" ]; then cp -r build/libs release_build/; fi
          touch release_build/build_info.txt

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-Release
          path: release_build/
