name: Build Ardour Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 git pkg-config \
            libglib2.0-dev libgtk-3-dev libjack-jackd2-dev libasound2-dev libpulse-dev \
            libserd-dev libsord-dev libsratom-dev liblv2-dev lilv-utils libaubio-dev \
            libfftw3-dev libogg-dev libvorbis-dev libflac-dev libsndfile1-dev liblo-dev \
            libcurl4-openssl-dev libarchive-dev libboost-all-dev libtag1-dev \
            libwebsockets-dev libxml2-dev libsigc++-2.0-dev libglibmm-2.4-dev \
            libcairomm-1.0-dev libpangomm-1.4-dev libgtkmm-2.4-dev

      - name: Configure (Release / Optimized)
        run: ./waf configure --optimize

      - name: Compile
        run: ./waf -j$(nproc)

      - name: Bundle Executables
        run: |
          mkdir -p release_build
          cp -r build/gtk2_ardour release_build/
          cp -r build/libs release_build/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Linux-Release
          path: release_build/
