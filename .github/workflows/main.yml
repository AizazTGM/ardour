name: Build Ardour (MSYS2 UCRT64)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 and Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-cairomm
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-libsigc++
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-pangomm
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-jack2
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-lv2
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-aubio
            mingw-w64-ucrt-x86_64-gtk2
            mingw-w64-ucrt-x86_64-atk
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            git
            make
            zip

      - name: Fetch upstream tags
        shell: msys2 {0}
        run: |
          git remote add upstream https://github.com/Ardour/ardour.git || true
          git fetch upstream --tags

      # ------------------------------------------------------------
      # Restore Waf Cache
      # ------------------------------------------------------------
      - name: Restore Waf Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            ~/.wafcache
          key: waf-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            waf-build-${{ runner.os }}-

      # ------------------------------------------------------------
      # Patch PortAudio Wscript
      # ------------------------------------------------------------
      - name: Patch PortAudio Wscript
        shell: msys2 {0}
        run: |
          sed -i 's/-Wl,-Bstatic//g' libs/backends/portaudio/wscript
          sed -i 's/-Wl,-Bdynamic//g' libs/backends/portaudio/wscript

      # ------------------------------------------------------------
      # Configure Ardour
      # ------------------------------------------------------------
      - name: Configure Ardour
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          export WAF_NO_PREFORK=1
          export MSYSTEM="UCRT64"
          export MSYS2_ARG_CONV_EXCL="*"
          export PATH="/ucrt64/bin:/usr/bin:${PATH}"
          export CC="/ucrt64/bin/gcc.exe"
          export CXX="/ucrt64/bin/g++.exe"
          export AR="/ucrt64/bin/ar.exe"
          export RANLIB="/ucrt64/bin/ranlib.exe"
          export STRIP="/ucrt64/bin/strip.exe"
          export WINDRES="/ucrt64/bin/windres.exe"
          export PKG_CONFIG="/ucrt64/bin/pkg-config.exe"
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="/ucrt64/lib/pkgconfig"
          export CXXFLAGS="-fno-char8_t"

          ./waf configure \
            --check-c-compiler=gcc \
            --check-cxx-compiler=g++ \
            --dist-target=mingw \
            --optimize \
            --no-dr-mingw \
            --no-phone-home \
            --no-nls \
            --with-backends=dummy,portaudio \
            --prefix="$(pwd)/installed_ardour"

      - name: Print Waf config log on failure
        if: failure()
        run: |
          if [ -f "build/config.log" ]; then
            echo "=================== build/config.log ==================="
            cat build/config.log
            echo "========================================================"
          else
            echo "build/config.log not found."
          fi

      # ------------------------------------------------------------
      # Build Ardour
      # ------------------------------------------------------------
      - name: Build Ardour
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          ./waf build -v

      # ------------------------------------------------------------
      # Save Waf Cache
      # ------------------------------------------------------------
      - name: Save Waf Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            build/
            ~/.wafcache
          key: waf-build-${{ runner.os }}-${{ github.sha }}

      # ------------------------------------------------------------
      # Install & Bundle Ardour
      # ------------------------------------------------------------
      # - name: Install & Bundle Ardour
      #   shell: msys2 {0}
      #   run: |
      #     set -euxo pipefail

      #     # Create the final unified bin directory
      #     mkdir -p installed_ardour/bin

      #     # 1. Copy compiled Ardour executables and scanners
      #     cp -fv build/gtk2_ardour/ardour*.exe installed_ardour/bin/ || true
      #     cp -fv build/libs/fst/ardour-vst*.exe installed_ardour/bin/ || true
      #     cp -fv build/luasession/*.exe installed_ardour/bin/ || true
      #     cp -fv build/session_utils/*.exe installed_ardour/bin/ || true

      #     # 2. Recursively find and copy all internal Ardour core DLLs from build sub-folders
      #     find build -name "*.dll" -exec cp -fv {} installed_ardour/bin/ \; || true

      #     # 3. Copy runtime UCRT64 dependency DLLs
      #     cp -u /ucrt64/bin/*.dll installed_ardour/bin/ || true

      #     # Verify that core DLLs and ardour.exe are present
      #     echo "=== Verifying bundle bin contents ==="
      #     ls -la installed_ardour/bin/ardour.dll installed_ardour/bin/canvs.dll installed_ardour/bin/ardour-*.exe || true

      - name: Install & Bundle Lean Ardour Portable
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          # Create clean directory structure
          mkdir -p installed_ardour/bin
          mkdir -p installed_ardour/share/ardour9

          # 1. Copy compiled Ardour executables and scanners
          cp -fv build/gtk2_ardour/ardour*.exe installed_ardour/bin/ || true
          cp -fv build/libs/fst/ardour-vst*.exe installed_ardour/bin/ || true
          cp -fv build/luasession/*.exe installed_ardour/bin/ || true
          cp -fv build/session_utils/*.exe installed_ardour/bin/ || true

          # 2. Copy internal Ardour core DLLs from build sub-folders
          find build -name "*.dll" -exec cp -fv {} installed_ardour/bin/ \; || true

          # 3. Copy ONLY the essential GUI, audio, and utility runtime DLLs (instead of all 600+)
          # GTK, GLib, Cairo, Pango, Audio/MIDI, and Core dependencies
          cp -fv /ucrt64/bin/libgtk-win32-2.0-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libgdk-win32-2.0-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libglib-2.0-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libgobject-2.0-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libcairo-2.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libpango-1.0-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libpangowin32-1.0-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libintl-8.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libiconv-2.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libsndfile-1.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libsamplerate-0.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/liblo-7.dll installed_ardour/bin/ || true
          cp -fv /ucrt64/bin/libjack64.dll installed_ardour/bin/ || true

          # 4. Copy the required source share/ folder assets (themes, fonts, configs)
          cp -r share/* installed_ardour/share/ardour9/ || true

          echo "=== Lean bundle ready ==="
          ls -la installed_ardour/bin/

      # ------------------------------------------------------------
      # Upload Artifact
      # ------------------------------------------------------------
      # - name: Upload Full Build Folder Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Ardour-Full-Build
      #     path: build/

      - name: Upload Organized Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-UCRT64-Portable
          path: installed_ardour/
