name: Build Ardour Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Source Repositories & Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Enable deb-src repositories so apt build-dep works
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources || true
          sudo apt-get update
          
          # Automatically fetch all official build dependencies for Ardour
          sudo apt-get build-dep -y ardour
          
          # Ensure python3 and Waf build essentials are ready
          sudo apt-get install -y python3 git build-essential

      - name: Configure (Release / Optimized)
        run: ./waf configure --optimize

      - name: Compile
        run: ./waf -j$(nproc)

      - name: Bundle Executables
        run: |
          mkdir -p release_build
          cp -r build/gtk2_ardour release_build/
          cp -r build/libs release_build/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Linux-Release
          path: release_build/
