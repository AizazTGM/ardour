name: Build Ardour (MSYS2 UCRT64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup MSYS2 and Install Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-cairomm
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-glibmm
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-pangomm
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-libsamplerate
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-vamp-plugin-sdk
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-lv2
            git
            make

      # ------------------------------------------------------------
      # Configure Ardour
      # ------------------------------------------------------------
      - name: Configure Ardour
        run: |
          set -euxo pipefail

          export WAF_NO_PREFORK=1

          if [ -d "${MINGW_PREFIX}/lib/ccache/bin" ]; then
            export PATH="${MINGW_PREFIX}/lib/ccache/bin:${PATH}"
          fi

          export CC="gcc"
          export CXX="g++"
          export AR="ar"
          export RANLIB="ranlib"
          export STRIP="strip"
          export WINDRES="windres"

          export PKG_CONFIG="pkg-config"
          export PKG_CONFIG_PATH="${MINGW_PREFIX}/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="${MINGW_PREFIX}/lib/pkgconfig"

          ./waf configure \
            --dist-target=mingw \
            --optimize \
            --no-dr-mingw \
            --no-phone-home \
            --no-nls \
            --with-backends=dummy,portaudio \
            --prefix=/Ardour

      # ------------------------------------------------------------
      # Build Ardour
      # ------------------------------------------------------------
      - name: Build Ardour
        run: |
          set -euxo pipefail
          ./waf build

      # ------------------------------------------------------------
      # Install / Package Ardour
      # ------------------------------------------------------------
      - name: Install Ardour
        run: |
          set -euxo pipefail
          ./waf install
